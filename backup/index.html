    "courseWorkload": "P50M"

<style>
  :root{
    --navy-950:#0D1B30;
    --navy-800:#16294A;
    --navy-700:#1F3864;
    --teal-500:#2BA6A0;
    --teal-100:#E7F0F1;
    --amber-400:#E7A83D;
    --amber-100:#FBEFDC;
    --paper:#F1F4F6;
    --card:#FFFFFF;
    --ink:#16233A;
    --ink-soft:#3A4A63;
    --line:#DDE3EA;
    --sidebar-w:300px;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-body:'Source Sans 3',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --transition-speed:0.3s;
  }

  /* Dark mode variables */
  [data-theme="dark"]{
    --paper:#0F172A;
    --card:#1E293B;
    --ink:#E2E8F0;
    --ink-soft:#94A3B8;
    --line:#334155;
    --teal-100:#164E63;
    --amber-100:#422006;
  }
  [data-theme="dark"] body{background:var(--paper);color:var(--ink);}
  [data-theme="dark"] .sidebar{background:#0B1120;}
  [data-theme="dark"] .row__title{color:#CBD5E1;}
  [data-theme="dark"] .row__num{color:#64748B;}
  [data-theme="dark"] section.block{background:var(--card);border-color:var(--line);}
  [data-theme="dark"] code{background:#1E293B;border-color:#334155;color:#7DD3FC;}
  [data-theme="dark"] .callout{background:#164E63;border-left-color:var(--teal-500);}
  [data-theme="dark"] .callout--amber{background:#422006;border-left-color:var(--amber-400);}
  [data-theme="dark"] .interactive-card{background:#1E293B;border-color:var(--teal-500);}
  [data-theme="dark"] .quiz-option{background:#1E293B;border-color:#334155;color:#E2E8F0;}
  [data-theme="dark"] .quiz-option:hover{background:#164E63;}
  [data-theme="dark"] .sim-box{background:#1E293B;border-color:#334155;}
  [data-theme="dark"] .toc{background:var(--card);border-color:var(--line);}
  [data-theme="dark"] .toc a{background:#1E293B;border-color:#334155;color:#94A3B8;}
  [data-theme="dark"] .toc a:hover{background:#164E63;border-color:var(--teal-500);}
  [data-theme="dark"] table.dtable tbody tr:nth-child(even){background:#1E293B;}
  [data-theme="dark"] table.dtable tbody th{background:#0F172A;}
  [data-theme="dark"] table.dtable tbody tr:hover{background:#164E63;}
  [data-theme="dark"] .navBtn{background:var(--card);border-color:var(--line);color:#94A3B8;}
  [data-theme="dark"] .navBtn:hover{border-color:var(--teal-500);color:var(--teal-500);}
  [data-theme="dark"] .chip{background:#164E63;border-color:#0E4444;color:#99F6E4;}
  [data-theme="dark"] .chip--amber{background:#422006;border-color:#78350F;color:#FCD34D;}
  [data-theme="dark"] .diagram-wrapper{background:#0F172A;}
  [data-theme="dark"] .sim-box{background:#1E293B;}
  [data-theme="dark"] .lockedNotice{background:var(--card);border-color:#334155;color:#94A3B8;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    display:flex;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:var(--navy-950);
    color:#DDE6F0;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar__brand{
    padding:26px 22px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar__status{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em;
    color:#7FD7C4; margin-bottom:14px;
  }
  .sidebar__status .dot{
    width:7px;height:7px;border-radius:50%;background:#37D19C;
    box-shadow:0 0 0 0 rgba(55,209,156,.6);
    animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(55,209,156,.55);}
    70%{box-shadow:0 0 0 7px rgba(55,209,156,0);}
    100%{box-shadow:0 0 0 0 rgba(55,209,156,0);}
  }
  .sidebar__title{
    font-family:var(--font-display); font-weight:700; font-size:20px;
    color:#fff; margin:0 0 4px;
  }
  .sidebar__sub{
    font-size:12.5px; color:#9FB1C9; line-height:1.5; margin:0;
  }

  .sidebar__progress{
    padding:14px 22px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar__progress-label{
    font-family:var(--font-mono); font-size:10.5px; color:#8CA0BA;
    display:flex; justify-content:space-between; margin-bottom:6px;
  }
  .sidebar__progress-bar{
    height:5px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden;
  }
  .sidebar__progress-fill{
    height:100%; background:linear-gradient(90deg,var(--teal-500),#7FD7C4);
    border-radius:3px;
  }

  .sidebar__list{
    list-style:none; margin:0; padding:10px 12px 24px; flex:1;
  }
  .row{
    display:flex; align-items:center; gap:11px;
    padding:9px 10px; border-radius:8px; margin-bottom:2px;
    cursor:pointer; border-left:3px solid transparent;
    transition:background .12s ease;
  }
  .row:hover{background:rgba(255,255,255,.05);}
  .row.active{
    background:rgba(43,166,160,.16);
    border-left-color:var(--teal-500);
  }
  .row.locked{cursor:default; opacity:.45;}
  .row.locked:hover{background:transparent;}
  .row__pk{
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    color:var(--navy-950); background:#7FD7C4;
    padding:2px 6px; border-radius:4px; letter-spacing:.03em;
    flex:0 0 auto;
  }
  .row.locked .row__pk{background:#3B4C68; color:#B9C6D8;}
  .row.active .row__pk{background:var(--teal-500); color:#03211D;}
  .row__text{display:flex; flex-direction:column; min-width:0;}
  .row__num{font-family:var(--font-mono); font-size:10px; color:#8CA0BA;}
  .row__title{
    font-size:13px; line-height:1.3; color:#EAF1F8;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row.locked .row__title{color:#8CA0BA; font-style:italic;}

  .sidebar__footer{
    padding:14px 22px 20px; border-top:1px solid rgba(255,255,255,.08);
    font-family:var(--font-mono); font-size:10.5px; color:#71839C; line-height:1.6;
  }

  /* ---------------- MAIN ---------------- */
  .main{flex:1; min-width:0; padding:44px 56px 90px;}
  .content{max-width:820px; margin:0 auto;}

  .contentHeader{margin-bottom:30px;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em;
    color:var(--teal-500); text-transform:uppercase; margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:"▸"; color:var(--amber-400);}
  h1.pageTitle{
    font-family:var(--font-display); font-size:32px; font-weight:700;
    color:var(--navy-950); margin:0 0 8px; line-height:1.2;
  }
  .pageSubtitle{
    font-size:16px; color:var(--ink-soft); margin:0 0 18px; max-width:680px;
  }
  .chipRow{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px;}
  .chip{
    font-family:var(--font-mono); font-size:11px; background:var(--teal-100);
    color:var(--navy-700); border:1px solid #BFE0DD; padding:5px 10px; border-radius:20px;
  }
  .chip--amber{background:var(--amber-100); border-color:#EFD3A0; color:#7A4E10;}

  /* table of contents */
  .toc{
    display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 8px;
    padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px;
  }
  .toc a{
    font-family:var(--font-mono); font-size:11px; color:var(--navy-700);
    text-decoration:none; padding:5px 11px; border-radius:16px;
    background:#EEF2F5; border:1px solid var(--line); white-space:nowrap;
  }
  .toc a:hover{background:var(--teal-100); border-color:var(--teal-500); color:var(--navy-800);}

  section.block{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:26px 28px; margin:22px 0; scroll-margin-top:24px;
  }
  section.block h2{
    font-family:var(--font-display); font-size:19px; color:var(--navy-800);
    margin:0 0 14px; padding-bottom:10px; border-bottom:2px solid var(--teal-100);
  }
  section.block h4{
    font-family:var(--font-display); font-size:14.5px; color:var(--navy-700);
    margin:18px 0 8px;
  }
  section.block p{line-height:1.7; margin:0 0 12px; color:var(--ink);}
  section.block ul, section.block ol{line-height:1.7; margin:0 0 12px; padding-left:22px;}
  section.block li{margin-bottom:5px;}
  .muted{color:#8494AB; font-weight:400; font-size:12.5px;}
  code{
    font-family:var(--font-mono); font-size:12px; background:#EEF2F5;
    border:1px solid var(--line); padding:1px 5px; border-radius:4px; color:var(--navy-700);
  }

  /* Code block highlighting */
  pre {
    background:#1E293B; border:1px solid #334155; border-radius:8px;
    padding:16px 18px; margin:14px 0; overflow-x:auto; position:relative;
  }
  pre code {
    background:none; border:none; padding:0; color:#E2E8F0; font-size:13px; line-height:1.6;
  }
  .code-lang {
    position:absolute; top:8px; right:12px; font-family:var(--font-mono);
    font-size:10px; color:#64748B; text-transform:uppercase; letter-spacing:.05em;
  }
  .hl-keyword { color:#7DD3FC; font-weight:600; }
  .hl-function { color:#A78BFA; }
  .hl-string { color:#86EFAC; }
  .hl-number { color:#FCA5A5; }
  .hl-comment { color:#64748B; font-style:italic; }
  .hl-operator { color:#FDE68A; }
  .hl-type { color:#F0ABFC; }

  [data-theme="dark"] code {
    background:#1E293B; border-color:#334155; color:#7DD3FC;
  }

  ol.steps{list-style:none; padding-left:0; counter-reset:step;}
  ol.steps li{
    counter-increment:step; position:relative; padding-left:34px; margin-bottom:10px;
  }
  ol.steps li::before{
    content:counter(step); position:absolute; left:0; top:0;
    width:23px; height:23px; border-radius:6px; background:var(--navy-700); color:#fff;
    font-family:var(--font-mono); font-size:11.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  table.dtable{
    width:100%; border-collapse:collapse; margin:14px 0 18px; font-size:14px;
  }
  table.dtable th, table.dtable td{
    border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top;
  }
  table.dtable thead th{
    background:var(--navy-700); color:#fff; font-family:var(--font-mono);
    font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
  }
  table.dtable tbody tr:nth-child(even){background:#F7FAFB;}
  table.dtable tbody th{
    background:#EEF2F5; font-family:var(--font-mono); font-size:12px;
    color:var(--navy-800); white-space:nowrap;
  }
  table.dtable tbody tr:hover{background:var(--teal-100);}

  .callout{
    background:var(--teal-100); border-left:4px solid var(--teal-500);
    padding:14px 18px; border-radius:0 8px 8px 0; margin:16px 0;
  }
  .callout--amber{background:var(--amber-100); border-left-color:var(--amber-400);}
  .callout__label{
    display:block; font-family:var(--font-mono); font-size:11px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; color:var(--navy-700); margin-bottom:6px;
  }
  .callout p{margin:0;}

  figure.diagram{margin:18px 0; text-align:center;}
  figure.diagram svg{width:100%; max-width:560px; height:auto;}
  figure.diagram figcaption{
    font-size:12px; color:#8494AB; font-style:italic; margin-top:8px;
  }

  ul.refs{padding-left:18px;}
  ul.refs li{margin-bottom:9px; line-height:1.6;}

  .lockedNotice{
    background:var(--card); border:1px dashed #B7C3D3; border-radius:12px;
    padding:48px 30px; text-align:center; color:var(--ink-soft);
  }
  .lockedNotice .bigIcon{font-family:var(--font-mono); font-size:34px; color:var(--amber-400); margin-bottom:10px;}

  .navFooter{
    display:flex; justify-content:space-between; margin-top:34px; gap:14px;
  }
  .navBtn{
    font-family:var(--font-mono); font-size:12.5px; color:var(--navy-700);
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:10px 16px; cursor:pointer; text-decoration:none;
  }
  .navBtn:hover{border-color:var(--teal-500); color:var(--teal-500);}
  .navBtn[disabled]{opacity:.35; pointer-events:none;}

  .menuToggle{display:none;}

  /* --- ANIMATIONS --- */
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }
  .content .contentHeader { animation: fadeInUp 0.4s ease-out; }
  .content .toc { animation: fadeIn 0.35s ease-out 0.1s both; }
  .content section.block {
    animation: fadeIn 0.35s ease-out both;
  }
  .content section.block:nth-child(3) { animation-delay:0.15s; }
  .content section.block:nth-child(4) { animation-delay:0.2s; }
  .content section.block:nth-child(5) { animation-delay:0.25s; }
  .content section.block:nth-child(6) { animation-delay:0.3s; }
  .content section.block:nth-child(7) { animation-delay:0.35s; }
  .content .navFooter { animation: fadeIn 0.3s ease-out 0.4s both; }

  html { scroll-behavior: smooth; }

  .row { transition:background .15s ease, border-left-color .15s ease, opacity .2s ease; }
  .navBtn { transition:border-color .2s ease, color .2s ease, background .2s ease; }
  .toc a { transition:background .2s ease, border-color .2s ease, color .2s ease; }
  .quiz-option { transition:background .2s ease, border-color .2s ease; }

  /* --- INTERACTIVE ELEMENTS --- */
  .interactive-card {
    background: #f8fafc;
    border: 2px solid var(--teal-500);
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
  }
  .quiz-option {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
  }
  .quiz-option:hover { background: var(--teal-100); }
  .quiz-option.correct { background: #dcfce7; border-color: #22c55e; }
  .quiz-option.wrong { background: #fee2e2; border-color: #ef4444; }
  
  .sim-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 15px;
    margin-top: 10px;
  }
  .sim-table-res { overflow-x: auto; }
  .btn-sim {
    padding: 8px 16px;
    background: var(--navy-700);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .btn-sim:hover { background: var(--navy-800); }

  /* --- ZOOM DIAGRAM --- */
  .diagram-container {
    position: relative;
    margin: 20px 0;
  }
  .diagram-zoom-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    justify-content: center;
  }
  .zoom-btn {
    padding: 6px 12px;
    background: var(--navy-700);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .zoom-btn:hover { background: var(--navy-800); }
  .diagram-wrapper {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fafbfc;
    max-height: 400px;
  }
  .diagram-inner {
    transform-origin: top center;
    transition: transform 0.2s ease;
    padding: 20px;
    display: inline-block;
  }
  .diagram-source {
    font-size: 10px;
    color: #8CA0BA;
    margin-top: 8px;
    font-style: italic;
    text-align: right;
  }

  /* --- READING PROGRESS BAR --- */
  .reading-progress{
    position:fixed; top:0; left:0; height:3px; z-index:9999;
    background:linear-gradient(90deg,var(--teal-500),#7FD7C4,var(--amber-400));
    width:0; transition:width 0.1s ease-out;
  }

  /* --- MOBILE HEADER --- */
  .mobile-header{
    display:none; position:fixed; top:0; left:0; right:0; z-index:1000;
    background:var(--navy-950); color:#fff; padding:12px 16px;
    align-items:center; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .mobile-header__title{
    font-family:var(--font-display); font-weight:600; font-size:15px; flex:1;
  }

  /* --- HAMBURGER MENU --- */
  .hamburger{
    background:none; border:none; cursor:pointer; padding:4px;
    display:flex; flex-direction:column; gap:5px; width:28px;
  }
  .hamburger span{
    display:block; width:100%; height:2.5px; background:#fff; border-radius:2px;
    transition:transform 0.3s, opacity 0.3s;
  }
  .hamburger.active span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
  .hamburger.active span:nth-child(2){opacity:0;}
  .hamburger.active span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}

  /* --- SIDEBAR OVERLAY --- */
  .sidebar-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:998;
    opacity:0; transition:opacity 0.3s;
  }
  .sidebar-overlay.active{display:block; opacity:1;}

  /* --- BACK TO TOP --- */
  .back-to-top{
    position:fixed; bottom:24px; right:24px; z-index:999;
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--navy-700); color:#fff; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateY(20px); pointer-events:none;
    transition:opacity 0.3s, transform 0.3s, background 0.2s;
  }
  .back-to-top.visible{opacity:1; transform:translateY(0); pointer-events:auto;}
  .back-to-top:hover{background:var(--teal-500);}

  /* --- COPY CODE BUTTON --- */
  .code-block-wrapper{position:relative;}
  .copy-code-btn{
    position:absolute; top:8px; right:8px; z-index:10;
    background:#334155; border:none; color:#94A3B8; cursor:pointer;
    padding:5px 10px; border-radius:4px; font-family:var(--font-mono);
    font-size:10px; transition:background 0.2s, color 0.2s;
  }
  .copy-code-btn:hover{background:#475569; color:#fff;}
  .copy-code-btn.copied{background:#166534; color:#fff;}

  /* --- LOADING SKELETON --- */
  @keyframes shimmer{
    0%{background-position:-200px 0;}
    100%{background-position:200px 0;}
  }
  .skeleton{
    background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);
    background-size:400px 100%; animation:shimmer 1.5s infinite;
    border-radius:6px;
  }
  .skeleton-title{height:28px; width:60%; margin-bottom:12px;}
  .skeleton-text{height:14px; width:100%; margin-bottom:8px;}
  .skeleton-text.short{width:80%;}
  .skeleton-box{height:120px; width:100%; margin:16px 0;}

  /* --- PRINT STYLES --- */
  @media print{
    .sidebar, .mobile-header, .back-to-top, .reading-progress,
    .sidebar-overlay, .navFooter, .toc, .interactive-card,
    .diagram-zoom-controls, #sidebarSearch, .hamburger,
    .quiz-option, .btn-sim, .sim-box, #themeToggle,
    .copy-code-btn, .bookmarkBtn, .chipRow{display:none !important;}
    
    body{display:block !important; background:#fff !important;}
    .main{padding:0 !important; max-width:100% !important;}
    .content{max-width:100% !important;}
    
    section.block{
      break-inside:avoid; page-break-inside:avoid;
      border:1px solid #ddd !important; box-shadow:none !important;
      background:#fff !important; margin:10px 0 !important;
    }
    
    h1.pageTitle{font-size:24pt !important; color:#000 !important;}
    h2{font-size:16pt !important; color:#333 !important;}
    p, li{font-size:11pt !important; color:#000 !important; line-height:1.5 !important;}
    
    table.dtable{border:1px solid #000 !important;}
    table.dtable th{background:#333 !important; color:#fff !important;}
    table.dtable td{border:1px solid #666 !important;}
    
    a{color:#000 !important; text-decoration:underline !important;}
    code{background:#f0f0f0 !important; border:1px solid #ccc !important;}
    
    pre{background:#f5f5f5 !important; border:1px solid #ccc !important;}
    pre code{color:#000 !important;}
    
    .callout{border:1px solid #999 !important; background:#f9f9f9 !important;}
    
    .contentHeader{margin-bottom:20px !important;}
    
    @page{margin:2cm; size:A4;}
  }

  /* --- MOBILE RESPONSIVE (UPDATED) --- */
  @media (max-width: 880px){
    :root{--sidebar-w:100%;}
    body{flex-direction:column;}
    
    .mobile-header{display:flex;}
    .sidebar{
      position:fixed; left:-100%; top:0; width:85%; max-width:320px;
      height:100vh; z-index:999; flex:none;
      overflow-y:auto; overflow-x:hidden;
      transition:left 0.3s ease;
    }
    .sidebar.open{left:0;}
    .sidebar__list{max-height:calc(100vh - 200px); overflow-y:auto; padding:10px 8px 16px;}
    .main{padding:70px 16px 60px; flex:1;}
    .content{max-width:100%; padding:0;}
    h1.pageTitle{font-size:22px;}
    section.block{padding:16px; margin:12px 0;}
    .toc{flex-direction:column; gap:6px; padding:12px;}
    .toc a{width:100%;}
    .navFooter{flex-direction:column;}
    .navBtn{width:100%;}
    .quiz-option{font-size:13px; padding:10px;}
    #simSearch{font-size:14px;}
    table.dtable{font-size:11px;}
    table.dtable th, table.dtable td{padding:5px 6px;}
    .back-to-top{bottom:16px; right:16px; width:40px; height:40px;}
    .diagram-wrapper{max-height:300px;}
    .interactive-card{padding:14px;}
  }

  @media (max-width: 480px){
    .main{padding:60px 12px 50px;}
    h1.pageTitle{font-size:20px;}
    .pageSubtitle{font-size:14px;}
    section.block{padding:14px 12px;}
    .chip{font-size:10px; padding:4px 8px;}
  }
</style>
</head>
<body>

  <!-- Reading Progress Bar -->
  <div class="reading-progress" id="readingProgress"></div>

  <!-- Mobile Header -->
  <header class="mobile-header" id="mobileHeader">
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-header__title" id="mobileHeaderTitle">Basis Data</span>
  </header>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" aria-label="Kembali ke atas">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__status"><span class="dot"></span>terhubung · <span id="dbNameLabel"></span></div>
      <p class="sidebar__title" id="courseName"></p>
      <p class="sidebar__sub" id="courseMeta"></p>
    </div>
    <div class="sidebar__progress">
      <div class="sidebar__progress-label"><span>PROGRES MATERI</span><span id="progressText"></span></div>
      <div class="sidebar__progress-bar"><div class="sidebar__progress-fill" id="progressFill"></div></div>
    </div>
    <div style="padding:8px 12px;">
      <input type="text" id="sidebarSearch" placeholder="Cari materi..." style="width:100%; padding:8px 12px; border-radius:6px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#E2E8F0; font-family:var(--font-mono); font-size:12px; outline:none; transition:border-color 0.2s;">
    </div>
    <ul class="sidebar__list" id="sidebarList"></ul>
    <div class="sidebar__footer">
      Portal materi lokal — buka <code style="background:rgba(255,255,255,.08);border:none;color:#B9C6D8;">index.html</code> langsung dari browser. Update materi lewat <code style="background:rgba(255,255,255,.08);border:none;color:#B9C6D8;">content.js</code>.
      <div style="margin-top:12px; display:flex; align-items:center; gap:8px;">
        <button id="themeToggle" class="zoom-btn" style="width:100%; padding:8px 12px; background:#1F3864; color:#E2E8F0; border:1px solid rgba(255,255,255,.1); font-size:12px; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px;">
          <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="content" id="content"><!-- dirender oleh app.js --></div>
  </main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
