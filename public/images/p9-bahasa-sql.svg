<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="720" height="330" fill="#FFFFFF"/>
  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#0B231B" letter-spacing="1" font-family="'JetBrains Mono', monospace">BAHASA PEMROGRAMAN BASIS DATA (SQL)</text>

  <!-- DDL -->
  <rect x="30" y="56" width="318" height="106" rx="12" fill="#0F2E22"/>
  <text x="52" y="80" font-size="11" font-weight="700" fill="#C9A227">DDL · Data Definition Language</text>
  <text x="52" y="100" font-size="9.5" fill="#E7EDF3">Mendefinisikan struktur: tabel &amp; skema</text>
  <rect x="52" y="116" width="276" height="30" rx="6" fill="#FFFFFF"/>
  <text x="190" y="135" text-anchor="middle" font-size="9" fill="#14382B" font-family="'JetBrains Mono', monospace">CREATE TABLE · ALTER · DROP</text>

  <!-- DML -->
  <rect x="372" y="56" width="318" height="106" rx="12" fill="#176B4D"/>
  <text x="394" y="80" font-size="11" font-weight="700" fill="#F6EFD9">DML · Data Manipulation Language</text>
  <text x="394" y="100" font-size="9.5" fill="#E7EDF3">Memproses isi data: tambah, ubah, ambil</text>
  <rect x="394" y="116" width="276" height="30" rx="6" fill="#FFFFFF"/>
  <text x="532" y="135" text-anchor="middle" font-size="9" fill="#14382B" font-family="'JetBrains Mono', monospace">INSERT · UPDATE · DELETE · SELECT</text>

  <!-- DCL -->
  <rect x="30" y="180" width="318" height="106" rx="12" fill="#1F8A5F"/>
  <text x="52" y="204" font-size="11" font-weight="700" fill="#F6EFD9">DCL · Data Control Language</text>
  <text x="52" y="224" font-size="9.5" fill="#E7EDF3">Mengelola hak akses pengguna</text>
  <rect x="52" y="240" width="276" height="30" rx="6" fill="#FFFFFF"/>
  <text x="190" y="259" text-anchor="middle" font-size="9" fill="#14382B" font-family="'JetBrains Mono', monospace">GRANT · REVOKE</text>

  <!-- TCL -->
  <rect x="372" y="180" width="318" height="106" rx="12" fill="#B08D1C"/>
  <text x="394" y="204" font-size="11" font-weight="700" fill="#0B231B">TCL · Transaction Control Language</text>
  <text x="394" y="224" font-size="9.5" fill="#221A02">Mengelola transaksi basis data</text>
  <rect x="394" y="240" width="276" height="30" rx="6" fill="#FFFFFF"/>
  <text x="532" y="259" text-anchor="middle" font-size="9" fill="#14382B" font-family="'JetBrains Mono', monospace">COMMIT · ROLLBACK</text>

  <text x="360" y="314" text-anchor="middle" font-size="10" fill="#8A99AA">Praktikum berikutnya akan banyak memakai DDL dan DML (Pertemuan 11–13).</text>
</svg>