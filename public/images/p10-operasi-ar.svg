<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="720" height="520" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0B231B" letter-spacing="1" font-family="'JetBrains Mono', monospace">OPERASI DASAR ALJABAR RELASIONAL</text>

  <text x="360" y="56" text-anchor="middle" font-size="10" fill="#8A99AA">Hasil setiap operasi selalu relasi → bisa dirangkai (komposisi)</text>

  <!-- Unary row -->
  <text x="360" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#14382B">UNARY · bekerja pada satu relasi</text>

  <!-- SELECT -->
  <rect x="30" y="102" width="205" height="110" rx="12" fill="#E3F2EC" stroke="#1F8A5F" stroke-width="1.5"/>
  <text x="132" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#176B4D" font-family="'JetBrains Mono', monospace">σ</text>
  <text x="132" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">SELECT · pilih baris</text>
  <text x="132" y="166" text-anchor="middle" font-size="9" fill="#55637A" font-family="'JetBrains Mono', monospace">σ&lt;prodi='Inf'&gt;(MHS)</text>
  <text x="132" y="184" text-anchor="middle" font-size="9" fill="#55637A">mirip WHERE di SQL</text>
  <text x="132" y="202" text-anchor="middle" font-size="9" fill="#C43A2F">memilih BARIS</text>

  <!-- PROJECT -->
  <rect x="257" y="102" width="205" height="110" rx="12" fill="#E3F2EC" stroke="#1F8A5F" stroke-width="1.5"/>
  <text x="360" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#176B4D" font-family="'JetBrains Mono', monospace">π</text>
  <text x="360" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">PROJECT · pilih kolom</text>
  <text x="360" y="166" text-anchor="middle" font-size="9" fill="#55637A" font-family="'JetBrains Mono', monospace">π&lt;nim,nama&gt;(MHS)</text>
  <text x="360" y="184" text-anchor="middle" font-size="9" fill="#55637A">buang duplikat</text>
  <text x="360" y="202" text-anchor="middle" font-size="9" fill="#C43A2F">memilih KOLOM</text>

  <!-- RENAME -->
  <rect x="484" y="102" width="205" height="110" rx="12" fill="#E3F2EC" stroke="#1F8A5F" stroke-width="1.5"/>
  <text x="587" y="126" text-anchor="middle" font-size="22" font-weight="700" fill="#176B4D" font-family="'JetBrains Mono', monospace">ρ</text>
  <text x="587" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">RENAME · ganti nama</text>
  <text x="587" y="166" text-anchor="middle" font-size="9" fill="#55637A" font-family="'JetBrains Mono', monospace">ρ&lt;MHS&gt;(MAHASISWA)</text>
  <text x="587" y="184" text-anchor="middle" font-size="9" fill="#55637A">relasi atau atribut</text>
  <text x="587" y="202" text-anchor="middle" font-size="9" fill="#C43A2F">mengganti NAMA</text>

  <!-- Binary row -->
  <text x="360" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#14382B">BINARY · bekerja pada dua relasi (union-compatible)</text>

  <!-- UNION -->
  <rect x="30" y="258" width="318" height="104" rx="12" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.5"/>
  <text x="189" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#B08D1C" font-family="'JetBrains Mono', monospace">R ∪ S</text>
  <text x="189" y="304" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">UNION · gabungkan, buang duplikat</text>
  <text x="189" y="322" text-anchor="middle" font-size="9" fill="#55637A">syarat: jumlah atribut sama, domain berpadanan</text>
  <text x="189" y="340" text-anchor="middle" font-size="9" fill="#C43A2F">R + S</text>

  <!-- SET DIFFERENCE -->
  <rect x="372" y="258" width="318" height="104" rx="12" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.5"/>
  <text x="531" y="284" text-anchor="middle" font-size="20" font-weight="700" fill="#B08D1C" font-family="'JetBrains Mono', monospace">R − S</text>
  <text x="531" y="304" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">SET DIFFERENCE · selisih</text>
  <text x="531" y="322" text-anchor="middle" font-size="9" fill="#55637A">tuple di R yang tidak ada di S · simetri: R−S ≠ S−R</text>
  <text x="531" y="340" text-anchor="middle" font-size="9" fill="#C43A2F">R − S</text>

  <!-- CARTESIAN PRODUCT -->
  <rect x="30" y="382" width="318" height="104" rx="12" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.5"/>
  <text x="189" y="408" text-anchor="middle" font-size="20" font-weight="700" fill="#B08D1C" font-family="'JetBrains Mono', monospace">R × S</text>
  <text x="189" y="428" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">CARTESIAN PRODUCT · perkalian silang</text>
  <text x="189" y="446" text-anchor="middle" font-size="9" fill="#55637A">setiap baris R dipasangkan dengan setiap baris S</text>
  <text x="189" y="464" text-anchor="middle" font-size="9" fill="#C43A2F">n(R) × m(S) baris</text>

  <!-- Note JOIN sebagai kombinasi -->
  <rect x="372" y="382" width="318" height="104" rx="12" fill="#FBE9E1" stroke="#B4552D" stroke-width="1.5"/>
  <text x="531" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#7A1F0E">TURUNAN: JOIN ⋈</text>
  <text x="531" y="426" text-anchor="middle" font-size="9.5" fill="#55637A">Inner / natural join &amp; intersection ∩</text>
  <rect x="388" y="436" width="286" height="38" rx="8" fill="#FFFFFF" stroke="#B4552D" stroke-width="1"/>
  <text x="531" y="453" text-anchor="middle" font-size="9" fill="#7A1F0E" font-family="'JetBrains Mono', monospace">R ⋈ S = σ&lt;kondisi&gt;(R × S)</text>
  <text x="531" y="468" text-anchor="middle" font-size="8.5" fill="#55637A">join dibangun dari operasi dasar</text>
</svg>