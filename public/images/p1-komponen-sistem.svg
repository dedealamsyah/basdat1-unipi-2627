<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="720" height="360" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0B231B" letter-spacing="1" font-family="'JetBrains Mono', monospace">5 KOMPONEN SISTEM BASIS DATA</text>

  <!-- Node pusat -->
  <rect x="255" y="140" width="210" height="84" rx="12" fill="#0F2E22" stroke="#0B231B" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SISTEM</text>
  <text x="360" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">BASIS DATA</text>
  <text x="360" y="212" text-anchor="middle" font-size="10" fill="#C9A227">5 komponen harus bekerja sama</text>

  <!-- Pengguna (atas) -->
  <polygon points="360,55 250,100 470,100" fill="none"/>
  <rect x="245" y="40" width="230" height="58" rx="10" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.5"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">PENGGUNA (USERS)</text>
  <text x="360" y="80" text-anchor="middle" font-size="9.5" fill="#55637A">DBA · Programmer · End-user</text>

  <!-- Data (kiri atas) -->
  <rect x="36" y="108" width="188" height="60" rx="10" fill="#E3F2EC" stroke="#1F8A5F" stroke-width="1.5"/>
  <text x="130" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#14382B">DATA</text>
  <text x="130" y="150" text-anchor="middle" font-size="9.5" fill="#55637A">Terintegrasi &amp; dipakai bersama</text>
  <line x1="224" y1="138" x2="255" y2="182" stroke="#8A99AA" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Hardware (kanan atas) -->
  <rect x="496" y="108" width="188" height="60" rx="10" fill="#E3F2EC" stroke="#1F8A5F" stroke-width="1.5"/>
  <text x="590" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#14382B">HARDWARE</text>
  <text x="590" y="150" text-anchor="middle" font-size="9.5" fill="#55637A">Server · Storage · Jaringan</text>
  <line x1="496" y1="138" x2="465" y2="182" stroke="#8A99AA" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Software (kiri bawah) -->
  <rect x="36" y="240" width="188" height="60" rx="10" fill="#FBE9E1" stroke="#B4552D" stroke-width="1.5"/>
  <text x="130" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#7A1F0E">SOFTWARE</text>
  <text x="130" y="282" text-anchor="middle" font-size="9.5" fill="#55637A">DBMS + aplikasi pendukung</text>
  <line x1="224" y1="270" x2="255" y2="224" stroke="#8A99AA" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Prosedur (kanan bawah) -->
  <rect x="496" y="240" width="188" height="60" rx="10" fill="#FBE9E1" stroke="#B4552D" stroke-width="1.5"/>
  <text x="590" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#7A1F0E">PROSEDUR</text>
  <text x="590" y="282" text-anchor="middle" font-size="9.5" fill="#55637A">Aturan &amp; SOP pengelolaan</text>
  <line x1="496" y1="270" x2="465" y2="224" stroke="#8A99AA" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#8A99AA">Kelimanya ada dan bersinergi agar sistem basis data berjalan.</text>
</svg>