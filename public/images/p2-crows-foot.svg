<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Public Sans', system-ui, sans-serif">
  <rect width="720" height="470" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#0B231B" letter-spacing="1" font-family="'JetBrains Mono', monospace">NOTASI CROW'S FOOT — KARDINALITAS</text>

  <!-- 1:1 -->
  <text x="48" y="72" font-size="12" font-weight="700" fill="#1E293B">1 : 1   satu ke satu</text>
  <text x="48" y="90" font-size="9" fill="#55637A">Satu A berelasi dengan tepat satu B. Contoh: KTP → WNI</text>

  <rect x="130" y="110" width="120" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="190" y="131" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">A</text>
  <line x1="250" y1="127" x2="430" y2="127" stroke="#1E293B" stroke-width="2"/>
  <circle cx="250" cy="127" r="4" fill="#fff" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="430" cy="127" r="4" fill="#fff" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="430" y="110" width="120" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="490" y="131" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">B</text>

  <!-- 1:N -->
  <line x1="40" y1="172" x2="680" y2="172" stroke="#E2E8F0" stroke-width="1"/>
  <text x="48" y="196" font-size="12" font-weight="700" fill="#1E293B">1 : N   satu ke banyak</text>
  <text x="48" y="214" font-size="9" fill="#55637A">Satu A berelasi dengan banyak B. Contoh: Dosen → Matakuliah</text>

  <rect x="130" y="234" width="120" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="190" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">A</text>
  <line x1="250" y1="251" x2="430" y2="251" stroke="#1E293B" stroke-width="2"/>
  <circle cx="250" cy="251" r="4" fill="#fff" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M430 246 L412 251 L430 256 M430 251 L442 251" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="430" y="234" width="120" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="490" y="255" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">B</text>

  <!-- M:N -->
  <line x1="40" y1="296" x2="680" y2="296" stroke="#E2E8F0" stroke-width="1"/>
  <text x="48" y="320" font-size="12" font-weight="700" fill="#1E293B">M : N   banyak ke banyak</text>
  <text x="48" y="338" font-size="9" fill="#55637A">Banyak A berelasi dengan banyak B. Contoh: Mahasiswa ↔ Matakuliah</text>

  <rect x="100" y="358" width="110" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="155" y="379" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">A</text>
  <path d="M210 372 L192 377 L210 382 M210 377 L222 377" fill="none" stroke="#1E293B" stroke-width="2"/>
  <line x1="210" y1="377" x2="510" y2="377" stroke="#1E293B" stroke-width="2"/>
  <path d="M510 372 L528 377 L510 382 M510 377 L498 377" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="510" y="358" width="110" height="34" rx="6" fill="#F6EFD9" stroke="#B08D1C" stroke-width="1.2"/>
  <text x="565" y="379" text-anchor="middle" font-size="10" font-weight="600" fill="#1E293B">B</text>
  <rect x="360" y="350" width="120" height="50" rx="8" fill="#C43A2F"/>
  <text x="420" y="370" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">DI-PECAH</text>
  <text x="420" y="386" text-anchor="middle" font-size="8.5" fill="#FCE9E7">jadi tabel penghubung</text>

  <text x="360" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#14382B">Kaki burung (crow's foot) pada sisi "banyak" = simbol &gt; 1</text>
  <text x="360" y="456" text-anchor="middle" font-size="10" fill="#8A99AA">M:N tidak bisa direpresentasikan satu kolom FK, wajib dipecah menjadi tabel penghubung.</text>
</svg>